# MCPize Configuration
# Docs: https://mcpize.com/docs/mcpize-yaml

version: 1

name: "Jñāpakam"
slug: "jnaapakam"

runtime: python
entry: "reference/server.py"

build:
  install: "pip install ."

startCommand:
  type: http
  command: "python"
  args:
    - "reference/server.py"

bridge:
  mode: http

credentials:
  # Required since v0.2: the server refuses to bind a public interface without a
  # token, because /clear and /restore are destructive and were previously open.
  - name: "MEMORY_AUTH_TOKEN"
  - name: "ANTHROPIC_API_KEY"
  - name: "OPENAI_API_KEY"
  - name: "LLM_API_KEY"
