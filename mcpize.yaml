# MCPize Configuration
# Docs: https://mcpize.com/docs/mcpize-yaml

version: 1

name: "Jñāpakam"
slug: "jnaapakam"

runtime: python
entry: "reference/server.py"

build:
  install: "pip install ."

startCommand:
  type: http
  command: "python"
  args:
    - "reference/server.py"

bridge:
  mode: http

secrets:
  # Publisher secret, provided at deploy time. Since v0.2 the server refuses to
  # bind a public interface without this token (it guards /clear and /restore),
  # so a deployment without it never comes up — the startup probe fails.
  # Generate one with: openssl rand -hex 32
  - name: "MEMORY_AUTH_TOKEN"
    required: true
    description: "Bearer token protecting /clear and /restore"

credentials:
  # Subscriber BYOK keys, injected per user at connect time. The server starts
  # without them; only LLM-backed operations (ingest/query/consolidate) need one.
  - name: "ANTHROPIC_API_KEY"
    required: false
    description: "Anthropic API key (used by the default model)"
  - name: "OPENAI_API_KEY"
    required: false
    description: "OpenAI API key"
  # Bring-your-own endpoint. Without LLM_BASE_URL here a subscriber could supply the
  # key but never the address, so the OpenAI-compatible path was unreachable on a
  # hosted deployment. Setting it routes every call to that endpoint and disables the
  # cloud fallback, so memory content stays on the operator's own infrastructure.
  - name: "LLM_BASE_URL"
    required: false
    description: "Base URL of an OpenAI-compatible endpoint (Ollama, vLLM, LM Studio, a proxy)"
  - name: "LLM_API_KEY"
    required: false
    description: "API key for a custom LLM_BASE_URL endpoint"
