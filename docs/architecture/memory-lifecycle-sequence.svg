<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="memory-lifecycle-sequence-title memory-lifecycle-sequence-desc">
      <title id="memory-lifecycle-sequence-title">Memory lifecycle sequence</title>
      <desc id="memory-lifecycle-sequence-desc">Sequence showing an Agent ingesting memories through the Server and LLM into SQLite, then searching and querying them back with ranked results.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="144" y1="148" x2="144" y2="520" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="400" y1="148" x2="400" y2="520" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="656" y1="148" x2="656" y2="520" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="872" y1="148" x2="872" y2="520" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="396" y="200" width="8" height="96" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="396" y="328" width="8" height="64" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="396" y="424" width="8" height="64" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="652" y="232" width="8" height="32" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="652" y="424" width="8" height="32" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="868" y="360" width="8" height="32" fill="#2d3142" fill-opacity="0.06" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages -->
      <line x1="144" y1="200" x2="400" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="250" y="180" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="272" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INGEST</text>
      <line x1="400" y1="232" x2="656" y2="232" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="506" y="212" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXTRACT</text>
      <line x1="656" y1="264" x2="400" y2="264" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="510" y="244" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="253" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JSON</text>
      <line x1="400" y1="296" x2="872" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="616" y="276" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="636" y="285" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INSERT</text>
      <line x1="144" y1="328" x2="400" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="250" y="308" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="272" y="317" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEARCH</text>
      <line x1="400" y1="360" x2="872" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="618" y="340" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="636" y="349" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FTS5</text>
      <line x1="872" y1="392" x2="400" y2="392" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="618" y="372" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="636" y="381" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HITS</text>
      <line x1="400" y1="424" x2="656" y2="424" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="506" y="404" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="413" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNTH</text>
      <line x1="656" y1="456" x2="400" y2="456" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="504" y="436" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="445" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANSWER</text>
      <line x1="400" y1="488" x2="144" y2="488" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="250" y="468" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="272" y="477" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RANKED</text>

      <!-- Actors -->
      <rect x="64" y="96" width="160" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="96" width="160" height="52" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="144" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent</text>
      <text x="144" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cli · rest</text>
      <rect x="320" y="96" width="160" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="96" width="160" height="52" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="400" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Server</text>
      <text x="400" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">aiohttp</text>
      <rect x="576" y="96" width="160" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="576" y="96" width="160" height="52" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <text x="656" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LLM</text>
      <text x="656" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">extract · judge</text>
      <rect x="800" y="96" width="144" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="800" y="96" width="144" height="52" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="872" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQLite</text>
      <text x="872" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fts5 · store</text>

      <!-- Legend -->
      <line x1="30" y1="532" x2="970" y2="532" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="30" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="110" y1="548" x2="142" y2="548" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="148" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">llm call</text>
      <line x1="230" y1="548" x2="262" y2="548" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="268" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">return</text>
      <line x1="340" y1="548" x2="372" y2="548" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="378" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">headline</text>
    </svg>