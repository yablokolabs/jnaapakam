<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="storage-continuity-dbschema-title storage-continuity-dbschema-desc">
      <title id="storage-continuity-dbschema-title">Storage and continuity schema</title>
      <desc id="storage-continuity-dbschema-desc">Database schema showing the memories table with its embedding sidecar and correction chain, plus generations and sealed artifacts for continuity.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- FK arrows (before boxes) -->
      <!-- embeddings -> memories -->
      <line x1="150" y1="368" x2="150" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="158" y="344" width="20" height="12" rx="2" fill="#f5f5f5"/>
      <text x="168" y="353" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FK</text>
      <!-- artifacts -> generations -->
      <path d="M 760,288 V 436 Q 760,444 752,444 H 608 Q 600,444 600,436 V 416" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="660" y="424" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="676" y="433" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEAL</text>
      <!-- generations self (parent) -->
      <path d="M 660,344 H 684 Q 692,344 692,352 V 376 Q 692,384 684,384 H 660" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="660" y="356" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="676" y="365" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SELF</text>
      <!-- memories self (supersede) -->
      <path d="M 340,232 H 364 Q 372,232 372,240 V 264 Q 372,272 364,272 H 340" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="340" y="244" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="356" y="253" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUP</text>

      <!-- memories (focal) -->
      <rect x="40" y="160" width="300" height="176" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="160" width="300" height="176" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="56" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">memories</text>
      <text x="284" y="184" fill="#eb6c36" fill-opacity="0.9" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <line x1="40" y1="196" x2="340" y2="196" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <text x="56" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">id PK · integer</text>
      <text x="56" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">namespace · text</text>
      <text x="56" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">summary · text</text>
      <text x="56" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">importance · real</text>
      <text x="56" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">superseded_by FK</text>
      <text x="56" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">archived · integer</text>
      <text x="56" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">+ validity · access</text>

      <!-- memory_embeddings -->
      <rect x="40" y="368" width="300" height="104" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="368" width="300" height="104" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="56" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">memory_embeddings</text>
      <line x1="40" y1="404" x2="340" y2="404" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <text x="56" y="424" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">memory_id FK</text>
      <text x="56" y="440" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">model · vector blob</text>
      <text x="56" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">fts: memories_fts</text>

      <!-- consolidations -->
      <rect x="400" y="160" width="260" height="104" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="160" width="260" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="416" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">consolidations</text>
      <line x1="400" y1="196" x2="660" y2="196" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <text x="416" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">id PK · integer</text>
      <text x="416" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">source_ids · json</text>
      <text x="416" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">insight · text</text>

      <!-- generations (focal) -->
      <rect x="400" y="296" width="260" height="120" rx="6" fill="#f5f5f5"/>
      <rect x="400" y="296" width="260" height="120" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="416" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">generations</text>
      <text x="604" y="320" fill="#eb6c36" fill-opacity="0.9" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LINEAGE</text>
      <line x1="400" y1="332" x2="660" y2="332" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <text x="416" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">id PK · agent_id</text>
      <text x="416" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">parent_id FK self</text>
      <text x="416" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">status · staged/live</text>
      <text x="416" y="400" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">manifest · json</text>

      <!-- generation_artifacts -->
      <rect x="700" y="160" width="260" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="700" y="160" width="260" height="128" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="716" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">generation_artifacts</text>
      <line x1="700" y1="196" x2="960" y2="196" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <text x="716" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">generation_id FK</text>
      <text x="716" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">name · corpus/state</text>
      <text x="716" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">digest · sha256</text>
      <text x="716" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">signature · ed25519</text>

      <!-- Legend -->
      <line x1="30" y1="564" x2="970" y2="564" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="30" y="584" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="110" y="576" width="12" height="12" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="128" y="586" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">sealed core</text>
      <line x1="220" y1="582" x2="252" y2="582" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="258" y="586" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">seal link</text>
      <line x1="340" y1="582" x2="372" y2="582" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="378" y="586" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">self ref</text>
    </svg>