<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="soul-pipeline-title soul-pipeline-desc">
  <title id="soul-pipeline-title">Agent soul and server pipeline</title>
  <desc id="soul-pipeline-desc">Architecture showing an AI agent holding soul, identity, and memory files above the jnaapakam server pipeline of ingest, SQLite storage, retrieval, and consolidation.</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="1000" height="800" fill="#f5f5f5"/>

  <g transform="translate(236,0)">
  <!-- Agent container -->
  <rect x="40" y="120" width="440" height="180" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <text x="64" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Your AI Agent</text>

  <!-- Soul files -->
  <rect x="64" y="164" width="124" height="104" rx="6" fill="#f5f5f5"/>
  <rect x="64" y="164" width="124" height="104" rx="6" fill="#7a8399" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
  <rect x="72" y="170" width="36" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="90" y="180" fill="#7a8399" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOUL</text>
  <text x="126" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SOUL.md</text>
  <text x="126" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">personality</text>

  <rect x="200" y="164" width="124" height="104" rx="6" fill="#f5f5f5"/>
  <rect x="200" y="164" width="124" height="104" rx="6" fill="#7a8399" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
  <rect x="208" y="170" width="52" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="234" y="180" fill="#7a8399" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IDENTITY</text>
  <text x="262" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">IDENTITY.md</text>
  <text x="262" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">name, emoji</text>

  <rect x="336" y="164" width="124" height="104" rx="6" fill="#f5f5f5"/>
  <rect x="336" y="164" width="124" height="104" rx="6" fill="#7a8399" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
  <rect x="344" y="170" width="44" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="366" y="180" fill="#7a8399" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEMORY</text>
  <text x="398" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MEMORY.md</text>
  <text x="398" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">long-term</text>

  <!-- Agent -> Server -->
  <line x1="260" y1="300" x2="260" y2="384" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="268" y="328" width="68" height="12" rx="2" fill="#f5f5f5"/>
  <text x="302" y="337" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP / MCP</text>

  <!-- Server container -->
  <rect x="40" y="384" width="440" height="324" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <text x="64" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">jnaapakam Server</text>

  <!-- Pipeline connectors -->
  <line x1="172" y1="480" x2="172" y2="492" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="172" y1="544" x2="172" y2="556" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <line x1="172" y1="608" x2="172" y2="620" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Stages -->
  <rect x="72" y="428" width="200" height="52" rx="6" fill="#f5f5f5"/>
  <rect x="72" y="428" width="200" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="172" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ingest (LLM)</text>

  <rect x="72" y="492" width="200" height="52" rx="6" fill="#f5f5f5"/>
  <rect x="72" y="492" width="200" height="52" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="172" y="524" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQLite + FTS5</text>

  <rect x="72" y="556" width="200" height="52" rx="6" fill="#f5f5f5"/>
  <rect x="72" y="556" width="200" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="172" y="588" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Retrieve</text>

  <rect x="72" y="620" width="200" height="52" rx="6" fill="#f5f5f5"/>
  <rect x="72" y="620" width="200" height="52" rx="6" fill="rgba(45,49,66,0.02)" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="172" y="652" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Consolidate</text>

  <!-- Annotations -->
  <text x="308" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">← New information arrives</text>
  <text x="308" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">← Extract entities, importance</text>
  <text x="308" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">← Structured store</text>
  <text x="308" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">← Full-text index, BM25 ranked</text>
  <text x="308" y="584" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">← relevance x recency x importance</text>
  <text x="308" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">← no LLM call, no network</text>
  <text x="308" y="648" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">← Periodic: patterns, connections</text>
  <text x="308" y="664" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">← LLM</text>
  </g>

  <!-- Legend -->
  <line x1="30" y1="748" x2="970" y2="748" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <text x="30" y="768" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="110" y="760" width="12" height="12" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
  <text x="128" y="768" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">primary store</text>
  <line x1="240" y1="766" x2="272" y2="766" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="278" y="768" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">flow</text>
</svg>
