[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jnaapakam"
version = "0.4.1"
description = "An open protocol for AI agent memory persistence"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Yabloko Labs" }]
keywords = ["ai", "agent", "memory", "mcp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["aiohttp>=3.9.0"]

[project.optional-dependencies]
# Signing is optional so the base install stays at one dependency. Without it,
# seals still carry digests; they just cannot be signed or verified.
signing = ["cryptography>=42"]
# Semantic retrieval scans every vector in a namespace per query; numpy is what
# makes that a matrix multiply instead of a Python loop.
embeddings = ["numpy>=1.24"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "cryptography>=42", "numpy>=1.24"]

[project.scripts]
jnaapakam = "jnaapakam.cli:main"

[project.urls]
Homepage = "https://github.com/yablokolabs/jnaapakam"
Repository = "https://github.com/yablokolabs/jnaapakam"

[tool.hatch.build.targets.wheel]
packages = ["src/jnaapakam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly so CI does not drift when ruff changes its defaults.
# BLE/TRY are excluded deliberately: broad excepts at the HTTP and background-loop
# boundaries are intentional (a malformed request must not drop the connection; one
# bad file must not kill the watcher), and ValueError is the right type for input
# rejection here because the error middleware maps it to HTTP 400.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["SIM105"]
